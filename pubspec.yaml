name: tracesci_app
description: TraceSci - product authenticity and supply chain traceability.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  mobile_scanner: ^5.2.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
